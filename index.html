<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice for the London PCO (private hire) SERU and topographical assessments.">
<meta name="theme-color" content="#14202a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>PCO Prep London</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
</style>
<style>
/* Layout: kerbside study app. Sticky top bar, tabbed views, one column of cards; map views scroll sideways inside their own frame on phones. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunk:#e4e8ec; --ink:#14202a; --muted:#56636e; --line:#d3dae0;
  --accent:#f2c200; --accent-ink:#7a5d00; --on-accent:#14202a;
  --go:#1d8048; --go-soft:#dff2e6; --stop:#c0352a; --stop-soft:#fbe4e1; --info:#2457a6; --info-soft:#e2ebf8;
  --block:#e2e5dc; --road:#ffffff; --road-edge:#b4bcc3; --park:#cfe5c6; --map-ink:#3b4852; --aroad:#1e6b3c;
  --f-display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#162027; --sunk:#1c2830; --ink:#e6ecef; --muted:#95a3ae; --line:#2a3741;
  --accent:#f2c200; --accent-ink:#f5d24e; --on-accent:#14202a;
  --go:#46c37a; --go-soft:#173a26; --stop:#ff7468; --stop-soft:#42201d; --info:#79a5f2; --info-soft:#1a2b45;
  --block:#1b252c; --road:#3a4752; --road-edge:#56636e; --park:#1f3a29; --map-ink:#c9d3da; --aroad:#3fae6a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#162027; --sunk:#1c2830; --ink:#e6ecef; --muted:#95a3ae; --line:#2a3741;
  --accent:#f2c200; --accent-ink:#f5d24e; --on-accent:#14202a;
  --go:#46c37a; --go-soft:#173a26; --stop:#ff7468; --stop-soft:#42201d; --info:#79a5f2; --info-soft:#1a2b45;
  --block:#1b252c; --road:#3a4752; --road-edge:#56636e; --park:#1f3a29; --map-ink:#c9d3da; --aroad:#3fae6a;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.1rem;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.node:focus-visible{outline:3px solid var(--info);outline-offset:2px}
a{color:var(--info)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.01em;white-space:nowrap}
.brand .lines{width:26px;height:14px;display:grid;gap:3px}
.brand .lines i{display:block;height:3px;background:var(--accent);border-radius:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:640px){.tabs{flex-basis:100%}.bar .wrap{gap:6px}}
.tab{background:none;border:0;color:inherit;opacity:.72;padding:8px 12px;border-radius:8px;white-space:nowrap;font-weight:700;font-size:.95rem}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{opacity:1;background:var(--accent);color:var(--on-accent)}

main{padding-block:24px 64px}
.view{display:grid;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:.95rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.note{font-size:.88rem;color:var(--muted)}
.kerb{height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,transparent 28px 40px);border-radius:3px;opacity:.9}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.88rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.pill.pass{background:var(--go-soft);color:var(--go)}
.pill.fail{background:var(--stop-soft);color:var(--stop)}
.pill.neutral{background:var(--sunk);color:var(--muted)}

/* progress meters */
.meters{display:grid;gap:10px;margin-top:12px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:4px 10px;align-items:center;font-size:.9rem}
.meter .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter .fill{height:100%;background:var(--go);border-radius:4px}
.meter .fill.low{background:var(--stop)}
.meter .fill.mid{background:var(--accent)}
.meter .val{text-align:right;font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}

/* question */
.q{display:grid;gap:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.qtext{font-size:1.18rem;font-weight:700;line-height:1.4;max-width:62ch}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);text-align:center;padding:0 4px}
.passage{background:var(--sunk);border-radius:8px;padding:14px 16px;font-size:.98rem;max-width:66ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--muted);flex:none;width:1.2em}
.opt.sel{border-color:var(--info);background:var(--info-soft)}
.opt.right{border-color:var(--go);background:var(--go-soft)}
.opt.wrong{border-color:var(--stop);background:var(--stop-soft)}
.opt[disabled]{cursor:default}
.explain{border-left:4px solid var(--go);padding:10px 14px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:.95rem}
.explain.bad{border-left-color:var(--stop)}
.explain b{display:block;margin-bottom:2px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;padding:4px 12px;border-radius:8px;background:var(--ink);color:var(--accent)}
.timer.low{color:var(--stop);background:var(--stop-soft)}
.qnav{display:flex;gap:4px;flex-wrap:wrap}
.qdot{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.75rem;padding:0}
.qdot.done{background:var(--info-soft);border-color:var(--info)}
.qdot.cur{outline:2px solid var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1}
.confirm{border:1.5px solid var(--accent);background:var(--sunk);border-radius:8px;padding:12px 14px;display:grid;gap:10px}

/* study notes */
details.sec{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.sec summary{padding:12px 16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
details.sec ul{margin:0;padding:0 16px 14px 34px;display:grid;gap:6px;font-size:.95rem}
details.sec .pg{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}

/* map */
.maplayout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.mapframe{position:relative;height:min(66vh,600px);border:1px solid var(--line);border-radius:var(--r);background:var(--block);overflow:hidden;touch-action:none}
.mapframe.small{height:min(52vh,420px)}
.mapframe svg{display:block;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
.mapframe svg:active{cursor:grabbing}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:grid;gap:6px}
.zoom button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:1.2rem;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dirs.exam{list-style:none;padding:0;margin:10px 0 0}
.dirs.exam li{display:grid;grid-template-columns:4.2em 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.dirs.exam .turn{font-weight:700;color:var(--accent-ink)}
table.marks{width:100%;border-collapse:collapse;margin-top:10px;font-size:.93rem}
table.marks td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.marks td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.task{font-size:1.05rem;font-weight:700}
.task .start{color:var(--go)} .task .end{color:var(--stop)}
.closure{display:inline-block;margin-top:6px;background:var(--stop-soft);color:var(--stop);font-weight:700;padding:3px 10px;border-radius:6px;font-size:.92rem}
.dirs{margin:0;padding-left:1.4em;display:grid;gap:4px;font-size:.95rem}
.dirs li::marker{font-family:var(--f-mono);color:var(--muted)}
.toast{padding:10px 14px;border-radius:8px;font-size:.93rem;font-weight:700}
.toast.bad{background:var(--stop-soft);color:var(--stop)}
.toast.good{background:var(--go-soft);color:var(--go)}
.toast.info{background:var(--info-soft);color:var(--info)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;font-size:.85rem}
.legend div{display:flex;gap:8px;align-items:center}
.legend svg{flex:none}
.node{cursor:pointer}
.node:hover .hit{fill:var(--info);fill-opacity:.18}
.score{font-family:var(--f-display);font-weight:800;font-size:2rem}

/* exam-style route screen (fixed colours, like the test software) */
.exam{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:760px){.exam{grid-template-columns:minmax(0,1fr)}}
.exam-instr{padding:18px 18px;font-size:1.02rem;line-height:1.38;display:grid;gap:10px;align-content:start;background:#fff;color:#111}
.exam-instr p,.exam-instr ol{margin:0}
.exam-instr ol{padding-left:1.3em;display:grid;gap:8px}
.exam-q{font-size:1.12rem}
.exam-q .start{color:#15803d}.exam-q .end{color:#c8001a}
.exam-closed{font-weight:700;color:#c8001a}
@media (max-width:760px){.exam-instr{font-size:.95rem;padding:14px 16px}.exam-instr ol,.exam-instr>p:not(.exam-q):not(.exam-closed){display:none}}
.exam-main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;background:#14104f}
.exam-bar{display:flex;gap:6px;flex-wrap:wrap;padding:6px;background:#14104f;align-items:center}
.eb{border:0;border-radius:2px;color:#fff;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.02em;padding:10px 16px;min-height:44px}
.eb.go{background:#16a34a}.eb.stop{background:#e8141c}.eb.undo{background:#2f8fe0}.eb.clear{background:#b01c25}.eb.dim{background:#3b4352}.eb.dim2{background:#3c5064}
.eb[disabled],.ebw[disabled]{opacity:.45;cursor:not-allowed}
.ebw{border:1px solid #9aa3ad;background:#f4f4f4;color:#111;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:1rem;padding:8px 18px;min-height:44px;border-radius:2px}
.ebw.strong{background:#ffd200;border-color:#ffd200}
.eb-note{color:#fff;font-weight:700;padding:0 8px}
.exam-map{border:0;border-radius:0;height:min(64vh,620px)}
.exam-map.drawing svg{cursor:crosshair}
.drawtag{position:absolute;left:10px;top:10px;background:#e8141c;color:#fff;font:700 .8rem Arial,sans-serif;padding:4px 8px;border-radius:2px;pointer-events:none}
footer{color:var(--muted);font-size:.85rem;padding-block:0 40px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.chip{transition:background-color .15s,border-color .15s}}
</style>
</head>

<footer class="wrap"><a href="privacy.html">Privacy policy</a> · Independent practice tool. Not made by or connected to Transport for London. SERU questions are written from TfL's PHV Driver's Handbook (version 1.0, September 2021). Rules change, so always check the current handbook and TfL guidance before your test.</footer>
<script>
/* SERU sections from the PHV Driver's Handbook v1.0 */
const SECTIONS={
  lic:"1 Driver licensing", veh:"2 Vehicle licensing", jour:"3 Private hire journeys", safe:"4 Staying safe",
  beh:"5 Driver behaviour", park:"6 Driving and parking", drive:"7 Safer driving", eq:"8 Equality and disability",
  sg:"9 Safeguarding", rs:"10 Ridesharing"
};
/* [section, type, question, [correct, wrong, wrong, wrong], explanation, handbook page]
   type: m = multiple choice, g = complete the sentence (____ marks the gap), r = reading and understanding */
const BANK=[
["lic","m","What is the minimum age to apply for a London PHV driver's licence?",["21","18","23","25"],"You must be at least 21. There is no upper age limit.",6],
["lic","m","How long must you have held a full driving licence before applying?",["At least 3 years","At least 1 year","At least 2 years","At least 5 years"],"You need a full DVLA, NI, EU or EEA licence held for at least three years.",6],
["lic","m","How long does a London PHV driver's licence normally last?",["3 years","1 year","2 years","5 years"],"A driver's licence normally lasts three years. Note the vehicle licence is different: one year.",7],
["lic","g","You must wear your badge at all times when working, including while you are ____ for bookings.",["waiting","parking","refuelling","resting"],"The badge must be worn whenever you work as a PHV driver, including waiting for bookings and driving to a pick-up.",7],
["lic","m","A police officer asks to see your PHV licence and you don't have it with you. What is the latest you can show it?",["Within 7 days","Within 24 hours","Within 14 days","Within 28 days"],"Show it there and then, or within seven days at most, to a police officer or TfL Authorised Officer.",7],
["lic","m","Your badge is stolen. What should you do?",["Report it to TfL immediately and to the police, and get a crime reference number","Keep working and report it at your next renewal","Borrow a colleague's badge until a new one arrives","Tell your operator only"],"Report a lost or stolen badge to TfL immediately. If stolen, also tell the police and get a crime reference number. You cannot work without a badge.",8],
["lic","m","Who does your PHV badge and licence belong to?",["TfL","You","Your operator","The DVLA"],"They remain TfL property, even after they expire, and must be returned.",8],
["lic","g","The badge includes ____ so that passengers with sight loss can check your licence number.",["Braille","a QR code","a hologram","a barcode"],"Badges carry Braille so passengers can note your licence number.",8],
["lic","m","From what age do you need a medical with every licence renewal application?",["45","40","50","60"],"From 45 a medical is needed at each renewal. From 65 it becomes every year.",8],
["lic","m","From what age do you need a medical assessment every year?",["65","60","70","75"],"From 65 you need an annual medical assessment.",8],
["lic","g","You must tell TfL within ____ days if you change your home address.",["21","7","14","28"],"Tell TfL within 21 days, and tell the DVLA too.",9],
["lic","m","You are diagnosed with a condition that may affect your driving. When must you tell TfL?",["Immediately","At your next renewal","Within 21 days","Only if your operator asks"],"New medical conditions that could affect your driving must be reported to TfL immediately.",8],
["lic","m","Which of these must you report to TfL immediately?",["Being arrested, charged, convicted or cautioned for any offence","A parking ticket with no penalty points","A complaint you sorted out with the passenger","Changing your mobile phone number"],"Any arrest, charge, conviction or caution must be reported to TfL immediately.",10],
["lic","m","Do you have to report a parking PCN that carries no penalty points?",["No, but frequent PCNs may lead to licensing action","Yes, within 7 days","Yes, immediately","Only if it is over £100"],"PCNs without points need not be reported, but a pattern of them can lead to action.",10],
["lic","m","You are arrested. Can you rely on the police to tell TfL?",["No, you must tell TfL yourself","Yes, the police always inform TfL","Yes, if you are not charged","Only if the arrest happened while working"],"The handbook says not to rely on the police. Report it yourself.",10],
["lic","m","Your PHV licence is revoked. When must you return it?",["Within 7 days","Within 24 hours","Within 21 days","Only when TfL writes again"],"A revoked licence must be returned within seven days.",10],
["lic","m","Which medical standard must PHV drivers meet?",["DVLA Group 2","DVLA Group 1","No medical standard","An eyesight check only"],"PHV drivers must meet DVLA Group 2 medical standards.",6],
["lic","g","The English language requirement for PHV drivers is level ____ of the CEFR.",["B1","A2","B2","C1"],"Speaking and listening are tested separately; reading and writing are shown by passing SERU.",6],
["lic","m","TfL writes to you about a complaint. Why should you reply?",["TfL can only decide using the information it receives","Replying is optional","The operator will reply for you","It only matters if the passenger was injured"],"Respond to TfL complaint letters: TfL makes its decision on the information it has.",10],

["veh","m","How long does a PHV vehicle licence last?",["1 year","6 months","3 years","5 years"],"A vehicle licence lasts one year. A new licensing inspection is needed before the next one is issued.",12],
["veh","m","When does a vehicle licensing inspection need to be done?",["Before each new vehicle licence is issued","Every three years","Only when the car is sold","Only after a collision"],"Vehicle licences last one year, and another inspection is needed before a new licence is issued.",12],
["veh","g","PHV licence discs are displayed on the front and ____ windscreens.",["rear","side","roof","passenger"],"Discs go on the front and rear windscreens.",12],
["veh","m","Can you take the licence discs off when using the car privately?",["No, they must not be removed","Yes, at weekends","Yes, if the operator agrees","Yes, if you put them in the glovebox"],"Discs must not be damaged, altered or removed, even for private use.",12],
["veh","m","Your vehicle's discs are damaged. What happens?",["The vehicle cannot be used for PHV work and the owner must contact TfL","You can carry on if the licence number is readable","You must stop working for 7 days","The operator replaces them"],"A vehicle with missing or badly damaged discs cannot be used for PHV work. The owner contacts TfL immediately.",12],
["veh","g","The vehicle owner must tell TfL within ____ hours of a collision that affects safety, performance, appearance or comfort.",["72","24","48","96"],"Collisions must be reported within 72 hours.",13],
["veh","m","What type of insurance must be valid while the vehicle is used as a PHV?",["Hire or reward","Social, domestic and pleasure only","Commuting cover","Third party, fire and theft only"],"Hire or reward insurance must be valid whenever the vehicle is licensed and used as a PHV.",13],
["veh","m","After a collision, who can ask for your insurance details?",["The police, and passengers or members of the public involved","Only the police","Only TfL","Nobody"],"Insurance details must be shown to police on request and given to passengers or the public after a collision.",13],

["jour","m","Who can you accept PHV bookings from?",["A licensed London PHV operator","Anyone who approaches you","Hotel or restaurant staff","Any app on your phone"],"Only accept bookings from a licensed London PHV operator, in a licensed PHV.",14],
["jour","m","How can you check an operator is licensed?",["Use TfL's licence checker","Ask other drivers","Look for a logo on their website","Call the DVLA"],"The TfL licence checker is a public register of drivers, vehicles and operators.",14],
["jour","g","A PHV is not a ____, so you cannot pick up passengers in the street without a booking.",["taxi","bus","coach","van"],"PHVs may not pick up on the street, at stations or at airports unless booked.",14],
["jour","m","Someone waves you down outside a station and asks for a ride. What can you do?",["Explain you need a booking, and give them a card with your operator's number","Take them if they pay in cash","Take them if it is raining","Let them in and book the trip once they are seated"],"Never let a passenger in before the booking is received. You may hand out your operator's card.",14],

/* ---------- SERU PRACTICE ---------- */
const P={filter:"all",mode:"quiz",cur:null,chosen:null,session:{seen:0,right:0},queue:[]};
function pool(){
  if(P.filter==="weak")return QS.filter(q=>S.wrong.includes(q.id));
  if(P.filter==="all")return QS;
  return QS.filter(q=>q.sec===P.filter);
}
function nextQ(){
  if(!P.queue.length)P.queue=shuffle(pool());
  const q=P.queue.shift();
  P.cur=q?prep(q):null;P.chosen=null;
}
function renderSeru(){
  if(!P.cur)nextQ();
  const chips=[["all","All sections"],["weak",`Revisit (${S.wrong.length})`]].concat(Object.entries(SECTIONS).map(([k,v])=>[k,v]))

    body=keys.map(k=>`<details class="sec" ${keys.length===1?"open":""}><summary>${esc(SECTIONS[k])}<span class="pg">${NOTES[k].length} facts</span></summary><ul>${NOTES[k].map(n=>`<li>${esc(n[0])} <span class="pg">p.${n[1]}</span></li>`).join("")}</ul></details>`).join("");

  }else{

      <button class="btn primary" id="nextBtn" ${P.chosen===null?"disabled":""}>Next question</button></div></div>`;
  }
  $("#v-seru").innerHTML=`<div><p class="eyebrow">SERU</p><div class="spread"><h2>Practice by section</h2>
    <div class="row"><button class="chip" data-m="quiz" aria-pressed="${P.mode==="quiz"}">Questions</button><button class="chip" data-m="notes" aria-pressed="${P.mode==="notes"}">Key facts</button></div></div>

    if(P.chosen!==null)return;
    P.chosen=+b.dataset.k;const ok=P.chosen===P.cur.correct;
    P.session.seen++;if(ok)P.session.right++;record(P.cur.q,ok);renderSeru();
    const n=$("#nextBtn");if(n)n.focus({preventScroll:true});
  });
  const n=$("#nextBtn");if(n)n.onclick=()=>{nextQ();renderSeru();};
}

/* ---------- SERU MOCK ---------- */
const M={state:"intro",items:[],answers:[],i:0,end:0,timer:null,confirm:false,result:null};
function buildMock(){
  const by=t=>shuffle(QS.filter(q=>q.type===t));
  let r=by("r").slice(0,2),g=by("g").slice(0,17),m=by("m");
  const need=37-r.length-g.length;m=m.slice(0,need);
  return shuffle(m.concat(g)).concat(r).map(prep);
}
function startMock(){M.items=buildMock();M.answers=M.items.map(()=>null);M.i=0;M.state="run";M.confirm=false;M.end=Date.now()+45*60*1000;tick();clearInterval(M.timer);M.timer=setInterval(tick,1000);renderMock();}
function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}
function tick(){
  if(M.state!=="run"){clearInterval(M.timer);return;}
  const left=M.end-Date.now();const t=$("#mockTimer");
  if(t){t.textContent=fmt(left);t.classList.toggle("low",left<5*60000);}
  if(left<=0)finishMock();
}
function finishMock(){
  clearInterval(M.timer);M.state="done";
  let right=0;const bySec={};
  M.items.forEach((p,i)=>{const ok=M.answers[i]===p.correct;if(ok)right++;const b=bySec[p.q.sec]||(bySec[p.q.sec]={n:0,r:0});b.n++;if(ok)b.r++;record(p.q,ok);});
  const score=Math.round(100*right/M.items.length);
  M.result={right,score,bySec};S.mocks.push({score,date:new Date().toISOString().slice(0,10)});save();renderMock();
}
function renderMock(){
  const v=$("#v-mock");
  if(M.state==="intro"){
    v.innerHTML=`<div><p class="eyebrow">SERU</p><h2>Mock test</h2><p class="lede" style="margin-top:6px">37 questions in 45 minutes, mixed like the real assessment: multiple choice, complete the sentence, and two reading questions. No feedback until you finish. You need 60% (23 correct) to pass.</p></div>

    $("#mStart").onclick=startMock;return;
  }
  if(M.state==="run"){
    const p=M.items[M.i];const answered=M.answers.filter(a=>a!==null).length;
    const dots=M.items.map((_,i)=>`<button class="qdot ${M.answers[i]!==null?"done":""} ${i===M.i?"cur":""}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join("");
    v.innerHTML=`<div class="spread"><div><p class="eyebrow">Mock test</p><h2>Question ${M.i+1} of 37</h2></div><span class="timer" id="mockTimer">${fmt(M.end-Date.now())}</span></div>
    <div class="card">${qHTML(p,{chosen:M.answers[M.i],reveal:false,num:"Q"+(M.i+1)})}
    <div class="spread" style="margin-top:16px"><div class="row"><button class="btn" id="mPrev" ${M.i===0?"disabled":""}>Previous</button><button class="btn primary" id="mNext">${M.i===36?"Review":"Next"}</button></div>
    <button class="btn quiet" id="mFinish">Finish test (${answered}/37 answered)</button></div>
    <div id="mConfirm">${M.confirm?`<div class="confirm" style="margin-top:12px"><span>${37-answered?`${37-answered} questions are unanswered. `:""}Submit your answers now?</span><div class="row"><button class="btn primary" id="mYes">Submit answers</button><button class="btn" id="mNo">Keep going</button></div></div>`:""}</div></div>
    <div class="card"><p class="eyebrow" style="margin-bottom:8px">Jump to question</p><div class="qnav">${dots}</div></div>`;
    v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{M.answers[M.i]=+b.dataset.k;renderMock();});
    v.querySelectorAll(".qdot").forEach(b=>b.onclick=()=>{M.i=+b.dataset.i;renderMock();});
    $("#mPrev").onclick=()=>{M.i--;renderMock();};
    $("#mNext").onclick=()=>{if(M.i<36){M.i++;renderMock();}else{M.confirm=true;renderMock();}};
    $("#mFinish").onclick=()=>{M.confirm=true;renderMock();};
    if(M.confirm){$("#mYes").onclick=finishMock;$("#mNo").onclick=()=>{M.confirm=false;renderMock();};}
    tick();return;
  }
  const R=M.result;const pass=R.score>=60;
  const secs=Object.entries(R.bySec).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([k,b])=>{const p=Math.round(100*b.r/b.n);return `<div class="meter"><span>${esc(SECTIONS[k])}</span><span class="val">${b.r}/${b.n}</span><div class="track"><div class="fill ${pctClass(p)}" style="width:${p}%"></div></div></div>`;}).join("");
  const wrong=M.items.map((p,i)=>({p,i})).filter(x=>M.answers[x.i]!==x.p.correct);
  v.innerHTML=`<div><p class="eyebrow">Mock test result</p><div class="row" style="align-items:flex-end;gap:16px"><span class="big">${R.score}%</span><span class="pill ${pass?"pass":"fail"}" style="margin-bottom:8px">${pass?"Pass":"Below the 60% pass mark"}</span></div>
    <p class="lede" style="margin-top:8px">${R.right} of 37 correct. ${pass?"Keep practising your weakest sections below.":"You need 23 correct. Focus on the weakest sections first."}</p></div>
    <div class="grid2"><div class="card"><h3>By section</h3><div class="meters">${secs}</div></div>
    <div class="card"><h3>Next steps</h3><p class="note" style="margin-top:6px">Wrong answers are added to your Revisit list in SERU practice.</p><div class="row" style="margin-top:14px"><button class="btn primary" id="mAgain">New mock</button><button class="btn" id="mRevisit">Practise wrong answers</button></div></div></div>
    <div style="display:grid;gap:12px"><h3>Review (${wrong.length} to check)</h3>${wrong.map(x=>`<div class="card">${qHTML(x.p,{chosen:M.answers[x.i],reveal:true,num:"Q"+(x.i+1)})}</div>`).join("")||'<p class="note">Nothing to review. Every answer was correct.</p>'}</div>`;
  $("#mAgain").onclick=()=>{M.state="intro";renderMock();};
  $("#mRevisit").onclick=()=>{P.filter="weak";P.mode="quiz";P.queue=[];nextQ();show("seru");};
}

/* ---------- TOPOGRAPHICAL: MAP MODEL ---------- */
const GW=12,GH=9,MG=64;

const LEGEND_NAMES=[["hospital","Hospital"],["station","Railway station"],["police","Police station"],["worship","Place of worship"],["school","School"],["museum","Museum"],["hotel","Hotel"],["parking","Car park"],["park","Park"]];
const POI_NAMES=["Kingsley","Northgate","St Anne's","Riverside","Weston","Holmfield","Ashby","Carlton","Meadow","Fenwick","Lindley","Marlow","Hawthorn","Brampton","Eastbury","Silverdale","Thornton","Wexford","Linton","Oakfield","Redcliffe","Southam","Kelvin","Moorgate"];

const GRID_C="ABCDEF",GRID_R=5;
const px=(m,n)=>m.xs[nx(n)],py=(m,n)=>m.ys[ny(n)];
const elen=(m,a,b)=>Math.hypot(px(m,a)-px(m,b),py(m,a)-py(m,b));

function genMap(){
  for(let tries=0;tries<200;tries++){
    const xs=[MG],ys=[MG];
    for(let i=1;i<GW;i++)xs.push(xs[i-1]+randInt(76,124));
    for(let i=1;i<GH;i++)ys.push(ys[i-1]+randInt(76,118));

/* pan with right-button drag (or any drag), scroll to zoom; a click that doesn't move calls onClick with map coordinates */
function wireViewer(id,m,state,onClick,focus){
  const box=document.getElementById(id);if(!box)return;const svg=box.querySelector("svg");
  if(!state.vb){state.vb=[0,0,m.VW,m.VH];
    if(box.clientWidth&&box.clientWidth<600){const w=Math.min(m.VW,480),h=w*box.clientHeight/box.clientWidth;const fx=focus!=null?px(m,focus):m.VW/2,fy=focus!=null?py(m,focus):m.VH/2;state.vb=[fx-w/2,fy-h/2,w,h];}}
  const apply=()=>svg.setAttribute("viewBox",state.vb.join(" "));apply();
  const zoom=(f,cx,cy)=>{const [x,y,w,h]=state.vb;let nw=Math.max(m.VW/8,Math.min(m.VW*1.05,w*f));const r=nw/w;const nh=h*r;
    if(cx===undefined){cx=x+w/2;cy=y+h/2;}state.vb=[cx-(cx-x)*r,cy-(cy-y)*r,nw,nh];apply();};
  state.zoom=zoom;state.home=()=>{state.vb=[0,0,m.VW,m.VH];apply();};
  box.querySelectorAll("[data-z]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const z=b.dataset.z;if(z==="in")zoom(.7);else if(z==="out")zoom(1/.7);else state.home();}));
  const toMap=(cx,cy)=>{const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const c=svg.getScreenCTM();return c?pt.matrixTransform(c.inverse()):{x:0,y:0};};
  let drag=null;
  box.addEventListener("contextmenu",e=>e.preventDefault());
  svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vb:state.vb.slice(),moved:e.button===2,btn:e.button,id:e.pointerId};if(e.button===2){try{svg.setPointerCapture(e.pointerId);}catch(_){}}});
  svg.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>6){drag.moved=true;try{svg.setPointerCapture(drag.id);}catch(_){}}
    if(drag.moved){const c=svg.getScreenCTM();const sc=c?1/c.a:1;state.vb=[drag.vb[0]-dx*sc,drag.vb[1]-dy*sc,drag.vb[2],drag.vb[3]];apply();}});
  svg.addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;if(d.moved||d.btn!==0||!onClick)return;const p=toMap(e.clientX,e.clientY);onClick(p.x,p.y);});
  svg.addEventListener("pointercancel",()=>{drag=null;});
  svg.addEventListener("wheel",e=>{e.preventDefault();const p=toMap(e.clientX,e.clientY);zoom(e.deltaY>0?1.15:1/1.15,p.x,p.y);},{passive:false});
}
/* turn the clicked points into a road route: each click snaps to the nearest junction;
   a straight stretch along one road fills in; anything else counts as leaving the road */
function deriveRoute(m,pts){
  const nodes=[];
  for(const [x,y] of pts){let best=null,bd=42;for(let n=0;n<GW*GH;n++){const d=Math.hypot(px(m,n)-x,py(m,n)-y);if(d<bd){bd=d;best=n;}}
    if(best===null)continue;if(nodes.length&&nodes[nodes.length-1]===best)continue;nodes.push(best);}
  const route=[];
  for(const b of nodes){
    if(!route.length){route.push(b);continue;}
    const a=route[route.length-1];
    if(nx(a)===nx(b)||ny(a)===ny(b)){const d=dirOf(a,b);const steps=[];let p=a,ok=true;
      while(p!==b){const q=nid(nx(p)+DV[d][0],ny(p)+DV[d][1]);if(!m.edges.has(ek(p,q))){ok=false;break;}steps.push(q);p=q;}
      if(ok){route.push(...steps);continue;}}
    route.push(b);
  }
  return route;
}

/* ---------- map multiple-choice questions ---------- */
const DN8={E:"East",NE:"North-east",N:"North",NW:"North-west",W:"West",SW:"South-west",S:"South",SE:"South-east"};
const SEC8=["E","NE","N","NW","W","SW","S","SE"];
function dir8(dx,dy){const ang=Math.atan2(dy,dx)*180/Math.PI;const f=((ang/45)%8+8)%8;if(Math.abs(f-Math.round(f))>.3)return null;return SEC8[Math.round(f)%8];}
function farDirs(d,n){const i=SEC8.indexOf(d);return shuffle(SEC8.filter((s,j)=>Math.min((j-i+8)%8,(i-j+8)%8)>=2)).slice(0,n);}
function mcq(q,correct,wrong,extra){const a=Array.isArray(correct)?correct:[correct];return Object.assign({q,opts:shuffle([...new Set(a.concat(wrong))]),a,multi:a.length>1},extra||{});}
function randomSquares(m,not,n){const all=[];for(const c of GRID_C)for(let r=1;r<=GRID_R;r++)all.push(c+r);return shuffle(all.filter(x=>x!==not)).slice(0,n);}
const MAPQ={
  symbol(m){const p=pick(m.pois.filter(p=>p.type!=="park"));const tn=Object.fromEntries(LEGEND_NAMES);
    return mcq("What does this map symbol show?",tn[p.type],shuffle(LEGEND_NAMES.filter(t=>t[0]!==p.type&&t[0]!=="park").map(t=>t[1])).slice(0,3),{sym:p.type,map:false,cat:"Map symbols"});},
  place(m){const p=pick(m.pois.filter(p=>!nearGridLine(m,p.cx,p.cy))||m.pois);const sq=gridSq(m,p.cx,p.cy);return mcq(`In which grid square is ${p.full}?`,sq,randomSquares(m,sq,3),{map:true,cat:"Places of interest"});},
  junction(m){for(let k=0;k<200;k++){const n=randInt(0,GW*GH-1);const hs=ORDER.filter(d=>d==="E"||d==="W").map(d=>[nx(n)+DV[d][0],ny(n)+DV[d][1]]).filter(([x,y])=>inGrid(x,y)).map(([x,y])=>m.edges.get(ek(n,nid(x,y)))).filter(Boolean);
      const vs=["N","S"].map(d=>[nx(n)+DV[d][0],ny(n)+DV[d][1]]).filter(([x,y])=>inGrid(x,y)).map(([x,y])=>m.edges.get(ek(n,nid(x,y)))).filter(Boolean);
      if(!hs.length||!vs.length||nearGridLine(m,px(m,n),py(m,n)))continue;const sq=gridSq(m,px(m,n),py(m,n));
      return mcq(`In which grid square does ${hs[0].name} meet ${vs[0].name}?`,sq,randomSquares(m,sq,3),{map:true,cat:"Finding streets"});}
    return null;},
  crossing(m){for(const s of shuffle(m.streets.filter(s=>s.keys.length>=3))){const nodes=new Set(s.keys.flatMap(k=>{const e=m.edges.get(k);return[e.a,e.b];}));
      const cross=[...new Set(m.streets.filter(o=>o.h!==s.h&&o.keys.some(k=>{const e=m.edges.get(k);return nodes.has(e.a)||nodes.has(e.b);})).map(o=>o.name))];
      const not=[...new Set(m.streets.filter(o=>o.h!==s.h&&!cross.includes(o.name)).map(o=>o.name))];
      if(cross.length<2||not.length<2)continue;return mcq(`Which TWO of these streets meet ${s.name}? Select two answers.`,shuffle(cross).slice(0,2),shuffle(not).slice(0,2),{map:true,cat:"Finding streets"});}
    return null;},
  roadnum(m){const s=pick(m.streets.filter(s=>s.road));if(!s)return null;
    return Math.random()<.5?mcq(`What is the road number of ${s.name}?`,s.road,shuffle(ROAD_NUMS.filter(r=>r!==s.road)).slice(0,3),{map:true,cat:"Road numbers"})
      :mcq(`Which road is the ${s.road}?`,s.name,shuffle(m.streets.filter(o=>o.name!==s.name)).slice(0,3).map(o=>o.name),{map:true,cat:"Road numbers"});},
  compass(m){for(const [a,b] of shuffle(m.pois.flatMap(a=>m.pois.filter(b=>b!==a).map(b=>[a,b])))){const d=dir8(a.cx-b.cx,b.cy-a.cy);if(!d||Math.hypot(a.cx-b.cx,a.cy-b.cy)<150)continue;
      return mcq(`Which direction is ${a.full} from ${b.full}?`,DN8[d],farDirs(d,3).map(x=>DN8[x]),{map:true,cat:"Compass points"});}
    return null;}
};
const LONQ={
  roadnum(){const [n,r]=pick(ROADS);return Math.random()<.5?mcq(`What is the road number of ${r}?`,n,shuffle(ROADS.filter(x=>x[0]!==n)).slice(0,3).map(x=>x[0]),{cat:"Road numbers"}):mcq(`Which of these roads is part of the ${n}?`,r,shuffle(ROADS.filter(x=>x[0]!==n)).slice(0,3).map(x=>x[1]),{cat:"Road numbers"});},

  compass(){const [p,d]=pick(COMPASS);return mcq(`From Charing Cross, in which direction is ${p}?`,DN8[d],farDirs(d,3).map(x=>DN8[x]),{cat:"Compass points"});},
  compass2(){const d=pick(["W","E","N","S"]);const i=SEC8.indexOf(d);const near=SEC8.filter((s,j)=>Math.min((j-i+8)%8,(i-j+8)%8)<=1);const yes=shuffle(COMPASS.filter(c=>near.includes(c[1])));const no=shuffle(COMPASS.filter(c=>{const j=SEC8.indexOf(c[1]);return Math.min((j-i+8)%8,(i-j+8)%8)>=3;}));

};

/* ---------- TOPOGRAPHICAL MOCK ---------- */
const T={state:"intro",map:null,items:[],ans:[],flags:[],views:[],i:0,end:0,timer:null,confirm:false,review:false,result:null};
function buildTopo(){
  let m,tasks;
  for(let k=0;k<20;k++){m=genMap();const avoid=new Set();tasks=[];for(const kind of ["short","closure","long"]){const tk=makeTask(m,kind,avoid);if(!tk)break;avoid.add(tk.s);avoid.add(tk.t);tasks.push(tk);}if(tasks.length===3)break;}
  namesFor(m,tasks);
  const gen=(f,...a)=>{for(let k=0;k<10;k++){const q=f(...a);if(q)return q;}return null;};
  const items=[];
  shuffle(ESSENTIALS).slice(0,4).forEach(e=>items.push(essentialQ(e)));
  tasks.forEach((tk,i)=>items.push({route:true,task:tk,label:["Short route","Short route with a road closure","Long route"][i]}));
  const seenSym=new Set();for(let k=0;k<2;k++){let q;for(let j=0;j<20;j++){q=MAPQ.symbol(m);if(!seenSym.has(q.sym))break;}seenSym.add(q.sym);items.push(q);}
  items.push(gen(MAPQ.place,m),gen(MAPQ.place,m),LONQ.place());
  items.push(gen(MAPQ.junction,m),gen(MAPQ.junction,m),gen(MAPQ.crossing,m)||gen(MAPQ.junction,m));
  items.push(gen(MAPQ.roadnum,m),gen(MAPQ.roadnum,m),LONQ.roadnum());
  items.push(gen(MAPQ.compass,m),gen(MAPQ.compass,m),gen(MAPQ.compass,m),LONQ.compass(),LONQ.compass(),LONQ.compass2());
  return{m,items:items.filter(Boolean)};
}
function topoStart(){const b=buildTopo();T.map=b.m;T.items=b.items;T.ans=T.items.map(it=>it.route?{pts:[],drawing:false,vb:null,bright:0}:null);T.flags=T.items.map(()=>false);T.views=T.items.map(()=>({}));T.i=0;T.state="run";T.confirm=false;T.review=false;T.end=Date.now()+70*60*1000;clearInterval(T.timer);T.timer=setInterval(topoTick,1000);renderTopo();}
function topoTick(){if(T.state!=="run"){clearInterval(T.timer);return;}const left=T.end-Date.now();const el=$("#topoTimer");if(el){el.textContent=fmt(left);el.classList.toggle("low",left<10*60000);}if(left<=0)topoFinish();}
const answeredItem=(it,a)=>it.route?a&&a.pts.length>1:a&&a.length===it.a.length;
function topoFinish(){
  clearInterval(T.timer);T.state="done";
  let routePts=0,mcRight=0,mcN=0;const marks=T.items.map((it,i)=>{if(it.route){const mk=markRoute(T.map,it.task,deriveRoute(T.map,T.ans[i].pts));routePts+=mk.pts;return mk;}mcN++;if(isRight(it,T.ans[i]))mcRight++;return null;});
  const mcPts=Math.round(34*mcRight/mcN);const total=routePts+mcPts;
  T.result={routePts,mcPts,mcRight,mcN,total,marks};S.topo=(S.topo||[]).concat([{score:total,date:new Date().toISOString().slice(0,10)}]);save();renderTopo();
}
function renderTopo(){
  const v=$("#v-topo");
  if(T.state==="intro"){
    v.innerHTML=`<div><p class="eyebrow">Topographical</p><h2>Mock assessment</h2><p class="lede" style="margin-top:6px">Set out like the current computer-based test: one on-screen map, three route questions (short, short with a road closure, long) and 21 multiple-choice questions, in 70 minutes. Nothing is marked until you submit.</p></div>
    <div class="card"><dl class="facts" style="margin-top:0"><dt>Questions</dt><dd>24 (21 multiple choice, 3 routes)</dd><dt>Time</dt><dd>70:00</dd><dt>Marks</dt><dd>Routes 66, multiple choice 34</dd><dt>Pass mark</dt><dd>60 out of 100</dd><dt>Previous attempts</dt><dd>${(S.topo||[]).length?S.topo.slice(-5).map(x=>x.score).join(", "):"None yet"}</dd></dl>
    <p class="note" style="margin-top:12px">Some questions need two answers; the question will say so. You can flag questions and come back to them before submitting.</p>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="tStart">Start the clock</button></div></div>`;
    $("#tStart").onclick=topoStart;return;
  }
  if(T.state==="run"){
    const N=T.items.length;const answered=T.items.filter((it,i)=>answeredItem(it,T.ans[i])).length;
    if(T.review){
      v.innerHTML=`<div class="spread"><div><p class="eyebrow">Topographical mock</p><h2>Review your answers</h2></div><span class="timer" id="topoTimer">${fmt(T.end-Date.now())}</span></div>
      <div class="card"><p class="note" style="margin-bottom:12px">${answered} of ${N} answered · ${T.flags.filter(Boolean).length} flagged. Tap a question to go back to it.</p>
      <div class="qnav">${T.items.map((it,i)=>`<button class="qdot ${answeredItem(it,T.ans[i])?"done":""}" data-i="${i}" style="${T.flags[i]?"border:2px solid var(--accent)":""}">${i+1}</button>`).join("")}</div>
      <div id="tConfirm" style="margin-top:14px">${T.confirm?`<div class="confirm"><span>${N-answered?`${N-answered} questions are unanswered. `:""}Submit the assessment now?</span><div class="row"><button class="btn primary" id="tYes">Submit assessment</button><button class="btn" id="tNo">Keep going</button></div></div>`:`<button class="btn primary" id="tSubmit">Submit assessment</button>`}</div></div>`;
      v.querySelectorAll(".qdot").forEach(b=>b.onclick=()=>{T.i=+b.dataset.i;T.review=false;T.confirm=false;renderTopo();});
      const s=$("#tSubmit");if(s)s.onclick=()=>{T.confirm=true;renderTopo();};
      if(T.confirm){$("#tYes").onclick=topoFinish;$("#tNo").onclick=()=>{T.confirm=false;renderTopo();};}
      topoTick();return;
    }
    const it=T.items[T.i];
    const head=`<div class="spread"><div><p class="eyebrow">Topographical mock</p><h2>Question ${T.i+1} of ${N}</h2></div><span class="timer" id="topoTimer">${fmt(T.end-Date.now())}</span></div>`;
    if(it.route){
      const st=T.ans[T.i];
      const bottom=`<button type="button" class="ebw" id="tReview">Review</button><button type="button" class="ebw" id="tFlag" aria-pressed="${T.flags[T.i]}">${T.flags[T.i]?"⚑ Flagged":"⚐ Flag"}</button><span style="flex:1"></span><button type="button" class="ebw" id="tPrev" ${T.i===0?"disabled":""}>Previous</button><button type="button" class="ebw" id="tNext">Next</button>`;
      v.innerHTML=head+`<p class="eyebrow">${esc(it.label)}</p>`+examUI("tMap",T.map,it.task,st,{bottom})+`<details class="sec"><summary>Map key</summary><div class="legend" style="padding:0 16px 16px">${legendHTML()}</div></details>`;
      wireExam("tMap",T.map,it.task,st,renderTopo);
    }else{
      v.innerHTML=head+`<div class="card" style="display:grid;gap:14px">${it.map?viewerHTML("tMap",T.map,{vb:T.views[T.i].vb},"small"):""}${mcHTML(it,T.ans[T.i],false,T.i)}
      <div class="spread"><div class="row"><button class="btn" id="tPrev" ${T.i===0?"disabled":""}>Previous</button><button class="btn primary" id="tNext">${T.i===N-1?"Review assessment":"Next"}</button></div>
      <div class="row"><button class="btn quiet" id="tFlag" aria-pressed="${T.flags[T.i]}">${T.flags[T.i]?"⚑ Flagged":"⚐ Flag this question"}</button><button class="btn quiet" id="tReview">Review assessment</button></div></div></div>
      ${it.map?`<details class="sec"><summary>Map key</summary><div class="legend" style="padding:0 16px 16px">${legendHTML()}</div></details>`:""}`;
      if(it.map)wireViewer("tMap",T.map,T.views[T.i],null);
      v.querySelectorAll(".opt[data-qi]").forEach(b=>b.onclick=()=>{T.ans[T.i]=toggleSel(it,T.ans[T.i],b.dataset.o);renderTopo();});
    }
    $("#tPrev").onclick=()=>{T.i--;renderTopo();};
    $("#tNext").onclick=()=>{if(T.i<N-1)T.i++;else T.review=true;renderTopo();};
    $("#tFlag").onclick=()=>{T.flags[T.i]=!T.flags[T.i];renderTopo();};
    $("#tReview").onclick=()=>{T.review=true;renderTopo();};
    topoTick();return;
  }
  const R=T.result;const pass=R.total>=60;
  const rows=T.items.map((it,i)=>{
    if(it.route){const mk=R.marks[i];return `<div class="card" style="display:grid;gap:12px"><div class="spread"><p class="eyebrow">Q${i+1} · ${esc(it.label)}</p><span class="pill ${mk.pts>=13?"pass":"fail"}">${mk.pts}/22</span></div><p class="task">${taskText(it.task)}</p>${it.task.closedName?`<span class="closure">NOTE: ${esc(it.task.closedName)} was CLOSED.</span>`:""}
      ${viewerHTML("rv"+i,T.map,{task:it.task,pts:T.ans[i].pts,best:it.task.best,vb:null},"small")}
      <div class="grid2" style="align-items:start"><div>${markHTML(mk)}</div><div><p class="eyebrow" style="margin-bottom:6px">A most direct route (dotted green)</p>${routeListHTML(writtenRoute(T.map,it.task.best,it.task,true))}</div></div></div>`;}
    const ok=isRight(it,T.ans[i]);if(ok)return "";
    return `<div class="card"><p class="eyebrow" style="margin-bottom:6px">Q${i+1}</p>${mcHTML(it,T.ans[i],true,i)}</div>`;
  }).join("");
  v.innerHTML=`<div><p class="eyebrow">Topographical mock result</p><div class="row" style="align-items:flex-end;gap:16px"><span class="big">${R.total}</span><span class="note" style="margin-bottom:6px">out of 100</span><span class="pill ${pass?"pass":"fail"}" style="margin-bottom:8px">${pass?"Pass":"Below the pass mark of 60"}</span></div></div>
    <div class="grid2"><div class="card"><h3>Breakdown</h3><dl class="facts"><dt>Route planning</dt><dd>${R.routePts} / 66</dd><dt>Multiple choice</dt><dd>${R.mcPts} / 34 (${R.mcRight} of ${R.mcN} correct)</dd></dl>
      <p class="note" style="margin-top:12px">Route marks use this app's practice scheme. TfL's assessors mark by hand and don't publish their exact scheme.</p></div>
      <div class="card"><h3>Next steps</h3><div class="row" style="margin-top:14px"><button class="btn primary" id="tAgain">New mock</button><button class="btn" id="tPractice">Practise routes</button></div></div></div>
    <h3>Routes, and questions to check</h3>${rows}`;
  T.items.forEach((it,i)=>{if(it.route)wireViewer("rv"+i,T.map,{},null,it.task.s);});
  $("#tAgain").onclick=()=>{T.state="intro";renderTopo();};
  $("#tPractice").onclick=()=>show("routes");
}

/* ---------- LONDON KNOWLEDGE ---------- */
const L={cat:"mixed",round:[],i:0,chosen:null,right:0};
const DNAME={N:"North",NE:"North-east",E:"East",SE:"South-east",S:"South",SW:"South-west",W:"West",NW:"North-west"};
const D8=["N","NE","E","SE","S","SW","W","NW"];
function lq(cat){
  if(cat==="roads"){const [n,r]=pick(ROADS);if(Math.random()<.5)return{q:`What is the road number of ${r}?`,a:n,opts:[n,...shuffle(ROADS.filter(x=>x[0]!==n)).slice(0,3).map(x=>x[0])],why:`${r} is part of the ${n}.`};
    return{q:`Which of these roads is part of the ${n}?`,a:r,opts:[r,...shuffle(ROADS.filter(x=>x[0]!==n)).slice(0,3).map(x=>x[1])],why:`${r} is part of the ${n}.`};}
  if(cat==="places"){const [p,a]=pick(PLACES);const areas=[...new Set(PLACES.map(x=>x[1]))].filter(x=>x!==a&&!x.includes(a)&&!a.includes(x));return{q:`In which area is ${p}?`,a,opts:[a,...shuffle(areas).slice(0,3)],why:`${p} is in ${a}.`};}
  if(cat==="compass"){const [p,d]=pick(COMPASS);const i=D8.indexOf(d);const wrong=shuffle(D8.filter((x,j)=>{const g=Math.min((j-i+8)%8,(i-j+8)%8);return g>=2;})).slice(0,3);return{q:`From Charing Cross, in which direction is ${p}?`,a:DNAME[d],opts:[DNAME[d],...wrong.map(x=>DNAME[x])],why:`${p} is ${DNAME[d].toLowerCase()} of Charing Cross.`};}
  return lq(pick(["roads","places","compass"]));
}
function newRound(){L.round=Array.from({length:10},()=>{const q=lq(L.cat);q.opts=shuffle(q.opts);return q;});L.i=0;L.chosen=null;L.right=0;}
function renderLondon(){
  if(!L.round.length)newRound();
  const cats=[["mixed","Mixed"],["roads","Road numbers"],["places","Places of interest"],["compass","Compass points"]].map(([k,l])=>`<button class="chip" data-c="${k}" aria-pressed="${L.cat===k}">${l}</button>`).join("");
  let body;
  if(L.i>=L.round.length){
    body=`<div class="card"><p class="eyebrow">Round complete</p><div class="score">${L.right}/10</div><div class="row" style="margin-top:12px"><button class="btn primary" id="lAgain">Play another round</button></div></div>`;
  }else{
    const q=L.round[L.i];
    const opts=q.opts.map((o,k)=>{let c="opt";if(L.chosen!==null){if(o===q.a)c+=" right";else if(o===L.chosen)c+=" wrong";}return `<button class="${c}" data-o="${esc(o)}" ${L.chosen!==null?"disabled":""}><span class="k">${KEYS[k]}</span><span>${esc(o)}</span></button>`;}).join("");
    body=`<div class="card"><div class="q"><div class="qmeta"><span class="mono">${L.i+1} of 10</span><span>·</span><span class="mono">${L.right} correct</span></div><p class="qtext">${esc(q.q)}</p><div class="opts">${opts}</div>
      ${L.chosen!==null?`<div class="explain ${L.chosen===q.a?"":"bad"}"><b>${L.chosen===q.a?"Correct":"Answer: "+esc(q.a)}</b>${esc(q.why)}</div>`:""}</div>
      <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" id="lNext" ${L.chosen===null?"disabled":""}>${L.i===9?"See score":"Next"}</button></div></div>`;
  }
  $("#v-london").innerHTML=`<div><p class="eyebrow">Topographical</p><h2>London knowledge</h2><p class="lede" style="margin-top:6px">Quick rounds on main road numbers, where well-known places are, and compass directions across London. Useful for the map questions and for working as a driver.</p></div><div class="chips">${cats}</div>${body}`;
  const v=$("#v-london");
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{L.cat=b.dataset.c;newRound();renderLondon();});
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(L.chosen!==null)return;L.chosen=b.dataset.o;const ok=L.chosen===L.round[L.i].a;if(ok)L.right++;S.london.seen++;if(ok)S.london.right++;save();renderLondon();});
  const n=$("#lNext");if(n)n.onclick=()=>{L.i++;L.chosen=null;renderLondon();};
  const a=$("#lAgain");if(a)a.onclick=()=>{newRound();renderLondon();};
}
